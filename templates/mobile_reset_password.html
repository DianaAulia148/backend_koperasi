<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atur Ulang Kata Sandi - Koperasi Harkat</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #FDF6F5 0%, #F5E6E3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(107, 13, 13, 0.08);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
        }
        .logo-container {
            width: 60px;
            height: 60px;
            background: #6B0D0D;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 16px rgba(107, 13, 13, 0.2);
        }
        .logo-icon {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }
        h2 {
            color: #6B0D0D;
            font-weight: 800;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #7A7A7A;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            font-size: 11px;
            font-weight: 800;
            color: #6B0D0D;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .input-container {
            position: relative;
        }
        input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: #FFFFFF;
            font-size: 14px;
            font-weight: 600;
            color: #2c2c2c;
            outline: none;
            transition: all 0.3s;
        }
        input:focus {
            border-color: #6B0D0D;
            box-shadow: 0 0 0 4px rgba(107, 13, 13, 0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: #6B0D0D;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 16px rgba(107, 13, 13, 0.25);
            margin-top: 16px;
        }
        .btn-submit:hover {
            background: #500A0A;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(107, 13, 13, 0.3);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .error-message {
            background: rgba(244, 67, 54, 0.08);
            border-left: 4px solid #F44336;
            color: #D32F2F;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <span class="logo-icon">H</span>
        </div>
        <h2>Atur Ulang Sandi</h2>
        <p class="subtitle">Buat kata sandi baru untuk akun Anda.</p>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form action="/api/auth/reset-password-web?token={{ token }}&email={{ email }}" method="POST">
            <div class="form-group">
                <label for="new_password">KATA SANDI BARU</label>
                <div class="input-container">
                    <input type="password" id="new_password" name="new_password" placeholder="Minimal 8 karakter" required>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm_password">KONFIRMASI KATA SANDI</label>
                <div class="input-container">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Ulangi kata sandi baru" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">Simpan Perubahan</button>
        </form>
    </div>
</body>
</html>
