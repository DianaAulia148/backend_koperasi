<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandi Berhasil Diperbarui - Koperasi Harkat</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #FDF6F5 0%, #F5E6E3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(107, 13, 13, 0.08);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
        }
        .success-icon-container {
            width: 80px;
            height: 80px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }
        .success-icon {
            color: #4CAF50;
            font-size: 40px;
            font-weight: bold;
        }
        h2 {
            color: #6B0D0D;
            font-weight: 800;
            font-size: 24px;
            margin-bottom: 12px;
        }
        .message {
            color: #555555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 500;
        }
        .info-box {
            background: rgba(107, 13, 13, 0.03);
            border: 1px dashed rgba(107, 13, 13, 0.15);
            border-radius: 12px;
            padding: 16px;
            font-size: 13px;
            color: #6B0D0D;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon-container">
            <span class="success-icon">✓</span>
        </div>
        <h2>Berhasil Diubah!</h2>
        <p class="message">Kata sandi akun koperasi Anda telah berhasil diperbarui. Silakan kembali ke aplikasi dan login dengan sandi yang baru.</p>
        <div class="info-box">
            Anda dapat menutup halaman ini sekarang.
        </div>
    </div>
</body>
</html>
